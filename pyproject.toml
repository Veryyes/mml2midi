[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mml2midi"
version = "0.1.0"
description = "Convert Mabinogi Music Language (MML) sheet music into Standard MIDI Files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "mido>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
mml2midi = "mml2midi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
